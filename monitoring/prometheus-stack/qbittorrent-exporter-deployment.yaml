---
# qBittorrent Exporter Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: qbittorrent-exporter
    namespace: prometheus-stack
    labels:
        app: qbittorrent-exporter
        app.kubernetes.io/name: qbittorrent-exporter
spec:
    replicas: 1
    selector:
        matchLabels:
            app: qbittorrent-exporter
            app.kubernetes.io/name: qbittorrent-exporter
    template:
        metadata:
            labels:
                app: qbittorrent-exporter
                app.kubernetes.io/name: qbittorrent-exporter
        spec:
            containers:
                - name: qbittorrent-exporter
                  image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:v1.5.1
                  ports:
                    - containerPort: 8000
                      name: metrics
                  env:
                    - name: QBITTORRENT_HOST
                      value: qbittorrent.qbt
                    - name: QBITTORRENT_PORT
                      value: "80"
                    - name: QBITTORRENT_USER
                      valueFrom:
                        secretKeyRef:
                            name: qbittorrent-exporter-credentials
                            key: username
                    - name: QBITTORRENT_PASS
                      valueFrom:
                        secretKeyRef:
                            name: qbittorrent-exporter-credentials
                            key: password
                    - name: EXPORTER_PORT
                      value: "8000"
                    - name: EXPORTER_LOG_LEVEL
                      value: INFO
                  resources:
                    requests:
                        cpu: 25m
                        memory: 64Mi
                    limits:
                        cpu: 100m
                        memory: 128Mi
---
# Service for qBittorrent Exporter
apiVersion: v1
kind: Service
metadata:
    name: qbittorrent-exporter
    namespace: prometheus-stack
    labels:
        app: qbittorrent-exporter
        app.kubernetes.io/name: qbittorrent-exporter
spec:
    selector:
        app: qbittorrent-exporter
        app.kubernetes.io/name: qbittorrent-exporter
    ports:
        - name: metrics
          port: 8000
          targetPort: metrics
---
# ServiceMonitor for qBittorrent Exporter
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: qbittorrent-exporter
    namespace: prometheus-stack
    labels:
        app: qbittorrent-exporter
        app.kubernetes.io/name: qbittorrent-exporter
spec:
    selector:
        matchLabels:
            app: qbittorrent-exporter
            app.kubernetes.io/name: qbittorrent-exporter
    endpoints:
        - port: metrics
          interval: 60s
          path: /metrics
    namespaceSelector:
        matchNames:
            - prometheus-stack
