---
# ServiceMonitor for Radarr Exportarr
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-radarr
  namespace: prometheus-stack
  labels:
    app: exportarr
    app.kubernetes.io/name: exportarr-radarr
spec:
  selector:
    matchLabels:
      app: exportarr
      app.kubernetes.io/name: exportarr-radarr
  endpoints:
  - port: metrics
    interval: 60s
    path: /metrics
  namespaceSelector:
    matchNames:
    - prometheus-stack

---
# ServiceMonitor for Sonarr Exportarr
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-sonarr
  namespace: prometheus-stack
  labels:
    app: exportarr
    app.kubernetes.io/name: exportarr-sonarr
spec:
  selector:
    matchLabels:
      app: exportarr
      app.kubernetes.io/name: exportarr-sonarr
  endpoints:
  - port: metrics
    interval: 60s
    path: /metrics
  namespaceSelector:
    matchNames:
    - prometheus-stack

---
#
# NOTE: onedr0p/exportarr does not support Jellyseerr.
