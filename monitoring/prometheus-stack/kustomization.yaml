apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus-stack

resources:
  - ns.yaml
  - alertmanager-config.yaml
  - custom-servicemonitors.yaml
  - custom-alerts.yaml
  - prometheus-http-route.yaml
  - grafana-http-route.yaml
  - alertmanager-http-route.yaml
  - exportarr-deployment.yaml
  # exportarr-secret.yaml # Managed separately - apply with: sops -d exportarr-secret.yaml | kubectl apply -f -
  - exportarr-servicemonitor.yaml
  # qbittorrent-exporter-secret.yaml # Managed separately - apply with: sops -d qbittorrent-exporter-secret.yaml | kubectl apply -f -
  - qbittorrent-exporter-deployment.yaml
  - media-alerts.yaml
  - media-dashboards-configmap.yaml

helmCharts:
- name: kube-prometheus-stack
  repo: https://prometheus-community.github.io/helm-charts
  version: 81.5.0
  releaseName: kube-prometheus-stack
  namespace: prometheus-stack
  valuesFile: values.yaml
