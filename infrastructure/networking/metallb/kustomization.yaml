apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metallb-system
resources:
  - ns.yaml
  - ip-pool.yaml
  - l2-advertisement.yaml
  - bgp-advertisement.yaml
  - bgp-peer.yaml
helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.14.9
    releaseName: metallb
    namespace: metallb-system
    valuesFile: values.yaml
    includeCRDs: true
