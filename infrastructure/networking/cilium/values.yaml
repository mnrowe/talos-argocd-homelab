cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

# Cilium Helm Values for Talos Proxmox Production Cluster
# ArgoCD Sync Wave: 0 (Foundation - must deploy before everything else)
annotations:
  argocd.argoproj.io/sync-wave: "0"

# Cluster Configuration
# IMPORTANT: cluster.name must match the --set cluster.name used during initial
# cilium install at bootstrap. Mismatched names break Hubble certificate SANs.
cluster:
  name: divx
  id: 1

# Kubernetes API Configuration (kubePrism via SideroLink)
k8sServiceHost: localhost
k8sServicePort: "7445"

# Kube-proxy Replacement
kubeProxyReplacement: true

# Talos-specific Security Context (required for init containers)
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE

# Talos-specific cgroup configuration
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Routing Configuration
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

# IPAM Configuration
ipam:
  mode: kubernetes

# Enable Socket-level Load Balancing (critical for pod-to-service connectivity)
socketLB:
  enabled: true
  hostNamespaceOnly: false

# Enable Bandwidth Manager for better TCP performance
bandwidthManager:
  enabled: true
  bbr: true # Enable BBR congestion control

# BPF Host Routing
bpf:
  masquerade: true
  # Connection tracking improvements for better session handling
  ctTcpTimeout: 21600 # 6 hours (default is 6 hours but explicit is better)
  ctAnyTimeout: 3600 # 1 hour for non-TCP connections

# L2 Announcements for LoadBalancer Services
l2announcements:
  enabled: true
  leaseDuration: "15s"
  leaseRenewDeadline: "5s"
  leaseRetryPeriod: "2s"

# Enable L2 neighbor discovery for ARP responses
l2NeighDiscovery:
  enabled: true
  refreshPeriod: "30s"

# Enable XDP acceleration (REQUIRED for Talos L2 announcements)
# Fixes kernel ARP dropping issue between XDP and TC in Talos 1.9+
# See: https://github.com/cilium/cilium/discussions/36829
loadBalancer:
  acceleration: best-effort

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 4Gi

# Increase API rate limits for L2 announcer lease management
# Formula: QPS = #services * (1 / leaseRenewDeadline)
# With 15 services: 15 * (1/5) = 3 QPS, so 20 QPS gives headroom
k8sClientRateLimit:
  qps: 20
  burst: 40

# Gateway API Support
gatewayAPI:
  enabled: true
  gatewayClass:
    create: "true"
  # Use Cluster mode for L2 announcements to work properly
  externalTrafficPolicy: Cluster
  hostNetwork:
    enabled: false

# Hubble (Observability)
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

envoy:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Operator Configuration
operator:
  replicas: 1
