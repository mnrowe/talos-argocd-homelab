apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  generators:
  - git:
      repoURL: https://github.com/mnrowe/talos-argocd-homelab.git
      revision: main
      directories:
      - path: infrastructure/controllers/cert-manager
      - path: infrastructure/networking/gateway
      - path: infrastructure/networking/cilium
      - path: infrastructure/networking/tailscale
      - path: infrastructure/storage/longhorn
      - path: infrastructure/storage/csi-driver-smb
      - path: infrastructure/storage/snapshot-controller
      - path: infrastructure/storage/volsync
      - path: infrastructure/storage/kopia
      - path: infrastructure/storage/longhorn
      - path: infrastructure/storage/snapshot-controller

  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        app.kubernetes.io/part-of: infrastructure
    spec:
      project: infrastructure
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mnrowe/talos-argocd-homelab.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - ApplyOutOfSyncOnly=true
        - Replace=false
        - IgnoreMissingTemplate=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
      - group: gateway.networking.k8s.io
        kind: Gateway
        jsonPointers:
        - /status
      - group: postgresql.cnpg.io
        kind: Cluster
        jsonPointers:
        - /status
        - /metadata/generation
      - group: external-secrets.io
        kind: ExternalSecret
        jsonPointers:
        - /status
        - /spec/data/*/remoteRef/conversionStrategy
        - /spec/data/*/remoteRef/decodingStrategy
        - /spec/data/*/remoteRef/metadataPolicy
      - group: kyverno.io
        kind: ClusterPolicy
        jsonPointers:
        - /status
        - /metadata/generation
      # PVC fields that are immutable after creation - needed for Volume Populator
      - group: ""
        kind: PersistentVolumeClaim
        jqPathExpressions:
        - .spec.dataSourceRef
        - .spec.dataSource
        - .spec.volumeName

