---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kopia-ui
  namespace: kopia
  labels:
    app.kubernetes.io/name: kopia-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kopia-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kopia-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kopia
          image: ghcr.io/home-operations/kopia:0.22.3
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /config/repository.config ]; then
                echo "No repository configured. Access web UI to set up."
                kopia server start --insecure --without-password --address=0.0.0.0:80 --override-hostname=kopia-server --override-username=kopia
              else
                kopia server start --insecure --config-file=/config/repository.config --address=0.0.0.0:80
              fi
          env:
            - name: USER
              value: "kopia"
            - name: KOPIA_WEB_ENABLED
              value: "true"
            - name: KOPIA_WEB_PORT
              value: "80"
            - name: KOPIA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kopia-ui-credentials
                  key: password
            - name: TZ
              value: "America/New_York"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: repository
              mountPath: /repository
            - name: config
              mountPath: /config/repository.config
              subPath: repository.config
            - name: cache
              mountPath: /config/cache
            - name: logs
              mountPath: /config/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repository
          nfs:
            server: 192.168.5.10
            path: /mnt/pool/nfs-share
        - name: config
          configMap:
            name: kopia-ui-config
        - name: cache
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kopia-ui
  namespace: kopia
  labels:
    app.kubernetes.io/name: kopia-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kopia-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

