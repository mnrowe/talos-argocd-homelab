# Talos Machine Config Patch — OOM Controller Trigger
#
# Workaround for siderolabs/talos#12526 on Talos v1.12.1.
#
# v1.12 introduced a userspace PSI-based OOM controller, enabled by default.
# On this cluster it fired on transient pressure spikes while nodes still had
# ~10Gi free, and SIGKILLed whole Burstable/BestEffort pod cgroups. Observed
# 198 triggers on talos-3vy-yfe, 35 on lg5, 8 on ujt in a single dmesg buffer.
#
# The damage chain it caused:
#   OOM controller kills the Longhorn instance-manager
#     -> volume engine dies, volume "detaches unexpectedly"
#     -> Longhorn auto-delete-pod-when-volume-detached-unexpectedly (default
#        true) deletes the workload pod
#     -> every app on a Longhorn PVC gets recreated on a loop
# It also killed cilium-agent 222 times, which broke pod networking on 3vy and
# produced cluster-wide Multi-Attach errors.
#
# The stock trigger is:
#   multiply_qos_vectors(d_qos_memory_full_total, {System: 8.0, Podruntime: 4.0}) > 3000.0 &&
#   multiply_qos_vectors(qos_memory_full_avg10, {System: 1.0, Podruntime: 1.0}) > 5.0 ||
#   memory_full_avg10 > 75.0 && time_since_trigger > duration("10s")
#
# Replaced with a threshold that only fires on sustained, near-total memory
# stall, with a long gap between actions so it cannot get into a kill loop.
#
# Apply to all nodes (no reboot required):
#   talosctl -n <node-ip> patch machineconfig --patch-file talos/oom-controller-patch.yaml
#
# Verify it landed:
#   talosctl -n <node-ip> get machineconfig -o yaml | grep -A3 "kind: OOMConfig"
#
# Confirm no new kills (timestamp should stop advancing):
#   talosctl -n <node-ip> dmesg | grep "OOM controller triggered" | tail -1
#
# REMOVE THIS PATCH after upgrading to Talos >= v1.12.2, which fixes the root
# cause ("make OOM controller more precise by considering separate cgroup
# PSI"). Cluster is on v1.12.1; latest at time of writing is v1.12.11.

apiVersion: v1alpha1
kind: OOMConfig
triggerExpression: |
  memory_full_avg10 > 99.0 && time_since_trigger > duration("300s")
sampleInterval: 1s
