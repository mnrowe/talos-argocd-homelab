# yaml-language-server: $schema=https://schemas.recyclarr.dev/latest/config-schema.json
radarr:
  movies:
    base_url: http://radarr.radarr.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
    quality_profiles:
      # Names override the guide's so existing movies keep their profile
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: HD Bluray + WEB (1080p) - Movies

sonarr:
  tv:
    base_url: http://sonarr.sonarr.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB-DL (1080p) - TV
      # Same guide scoring, but falls back to 720p for shows with no 1080p release
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB (720p/1080p) - TV
        upgrade:
          allowed: true
          until_quality: WEB 1080p
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        name: Remux-1080p - Anime
