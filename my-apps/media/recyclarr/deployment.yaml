apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recyclarr
  template:
    metadata:
      labels:
        app: recyclarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: recyclarr
        image: ghcr.io/recyclarr/recyclarr:8
        # No command: the image runs in cron mode and syncs on CRON_SCHEDULE
        env:
        - name: TZ
          value: America/New_York
        - name: CRON_SCHEDULE
          value: "@daily"
        envFrom:
        - secretRef:
            name: recyclarr-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
        - name: recyclarr-yml
          mountPath: /config/recyclarr.yml
          subPath: recyclarr.yml
          readOnly: true
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 1000m
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: recyclarr-config
      - name: recyclarr-yml
        configMap:
          name: recyclarr-config
