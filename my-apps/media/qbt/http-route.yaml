apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: qbt
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "qBittorrent"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "sh-qbittorrent"
    gethomepage.dev/href: "https://qbt.serverops.live"
spec:
  hostnames:
  - qbt.serverops.live
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-internal
    namespace: gateway
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: qbittorrent
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
