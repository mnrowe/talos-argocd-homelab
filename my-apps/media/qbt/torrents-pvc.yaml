apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbt-torrents-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.5.10
    path: /mnt/pool/share
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=30
    - retrans=3
    - noresvport
    - noatime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbt-torrents
  namespace: qbt
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: qbt-torrents-pv
  storageClassName: ""
