apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: jellyseerr
  labels:
    backup: "daily"
    backup-run-as-user: "1000"
    backup-run-as-group: "1000"
    backup-fs-group: "1000"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
