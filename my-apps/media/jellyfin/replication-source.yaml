apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jellyfin-config-backup
  namespace: jellyfin
spec:
  sourcePVC: jellyfin-config
  trigger:
    schedule: "0 2 * * *"  # Daily at 2 AM
  rsync:
    sshKeys: rsync-ssh-secret
    address: 192.168.5.10
    path: /mnt/pool/share/jellyfin-backups
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snapclass
