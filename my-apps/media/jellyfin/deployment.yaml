apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # /dev/dri is a hostPath: on a node with no GPU it mounts as an empty dir
      # and hw transcode silently fails (the pod stays Running but playback dies
      # with an encoder error). talos-lg5-et7 has no GPU, so this is REQUIRED,
      # not preferred -- a soft preference was tested and the scheduler still
      # chose lg5, since its 30Gi of RAM wins on resource-balance scoring.
      # Failover is between the two GPU nodes; if both are down, Pending is more
      # honest than Running-but-broken on lg5.
      # Prefer 3vy so jellyfin and Prometheus (now on ujt) don't stack up.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - talos-3vy-yfe
                - talos-ujt-i5w
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - talos-3vy-yfe
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:10.11.6
        ports:
        - containerPort: 8096
          name: http
        env:
        - name: TZ
          value: America/New_York
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        - name: media
          mountPath: /media
        - name: dri
          mountPath: /dev/dri
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: 2000m
        securityContext:
          privileged: true  # Required for GPU access
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: cache
        persistentVolumeClaim:
          claimName: jellyfin-cache
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media
      - name: dri
        hostPath:
          path: /dev/dri
