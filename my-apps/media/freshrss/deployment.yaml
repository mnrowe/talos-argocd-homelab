apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: freshrss
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
      - name: freshrss
        image: lscr.io/linuxserver/freshrss:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1001"
        - name: TZ
          value: America/New_York
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 1000m
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: freshrss-config
